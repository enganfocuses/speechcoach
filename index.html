        color: var(--text) !important;

        .ctrl-btn-small:hover,

      .sw-btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 9px 14px 9px 16px;
        border-radius: 50px;
        font-family: "Mulish", sans-serif;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .sw-track {
        width: 38px;
        height: 22px;
        border-radius: 11px;
        background: rgba(128, 128, 128, 0.4);
        position: relative;
        transition: background 0.25s;
      }
      .sw-track:after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.25s;
      }
      .sw-btn.on .sw-track {
        background: rgba(31, 42, 68, 0.6);
      }
      .sw-btn.on .sw-track:after {
        transform: translateX(16px);

        border-radius: 12px;
        cursor: pointer;
        font-size: 15px;
        font-family: inherit;
      }
      #notes {

        padding: 14px 16px;
        border-radius: 16px;
        border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.25));

        backdrop-filter: blur(14px) saturate(180%);
        -webkit-backdrop-filter: blur(14px) saturate(180%);
        font-size: 20px;
        line-height: 1.5;
        outline: none;
        overflow-wrap: anywhere;
      }
      #notes:focus {
        border-color: var(--accent, #666);
      }
      #notes:empty:before {
        content: attr(data-ph);
        opacity: 0.4;
      }
      @keyframes reveal {
        0% {
          opacity: 0;
          filter: blur(16px);
          letter-spacing: 6px;
          transform: translateY(8px) scale(0.94);
        }
        55% {
          opacity: 0.5;
          filter: blur(7px);
        }
        100% {
          opacity: 1;
          filter: blur(0);
          letter-spacing: 0;
          transform: none;
        }

      function startEffects(type) {
        clearEffects();
        if (type === "none") return;
        const calm = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
        const em = {
          leaves: ["\uD83C\uDF42", "\uD83C\uDF43", "\uD83C\uDF41"],
          halloween: ["\uD83C\uDF83", "\uD83D\uDC7B"],
          snow: ["\u2744", "\u26C4", "\u2745", "\u2746"],
        };
        const items = em[type] || [];
        if (!items.length) return;
        const c = $("effectsContainer");
        effectsInterval = setInterval(function () {
          const el = document.createElement("div");
          el.className = "falling-item";
          el.textContent = items[Math.floor(Math.random() * items.length)];
          el.style.left = Math.random() * 94 + "%";
          el.style.fontSize = Math.random() * 12 + 16 + "px";
          el.style.animationDuration = (calm ? Math.random() * 6 + 18 : Math.random() * 5 + 8) + "s";
          el.style.opacity = (Math.random() * 0.3 + 0.4).toString();
          c.appendChild(el);
          setTimeout(
            function () {
              if (el.parentNode) el.parentNode.removeChild(el);
            },
            calm ? 25000 : 15000,
          );
        }, calm ? 3000 : 1500);
      }

          if (mode === "nego" && currentCase) renderCase();
          else if (mode === "conflict" && currentAttack) renderConflict();
          else if (mode === "debate" && currentDebate) renderDebate();
          else if (mode === "interview" && currentInterview) renderInterview();
          else if (mode === "diction" && currentDiction) renderDiction();

      function renderCategories() {
        const g = $("categoriesGrid");
        g.innerHTML = "";
        catKeys.forEach(function (key) {
          const p = document.createElement("div");
          p.className = "category-pill";
          if (selectedCategories.has(key)) p.classList.add("active");
          p.textContent = catEmoji[key] + " " + catNames[key][currentLang];

            if (selectedCategories.has(key)) {

              p.classList.remove("active");

              selectedCategories.add(key);

      function generateTopic() {
        if (mode === "nego") {
          apiGet("nego", { avoid: currentCase ? currentCase.idx : -1, code: access ? access.code : "" })
            .then(
              latest(function (r) {
                currentCase = r;

              }),

          return true;

        if (mode === "debate") {
          apiGet("debate", { avoid: currentDebate ? currentDebate.idx : -1 })
            .then(
              latest(function (r) {
                currentDebate = r;
                debateSide = Math.random() < 0.5 ? "pro" : "con";
                renderDebate();
              }),
            )
            .catch(apiFail);
          return true;
        }
        if (mode === "interview") {
          apiGet("interview", { avoid: currentInterview ? currentInterview.idx : -1, code: access ? access.code : "" })
            .then(
              latest(function (r) {
                currentInterview = r;
                renderInterview();
              }),
            )
            .catch(apiFail);
          return true;
        }
        if (mode === "diction") {
          apiGet("diction")
            .then(
              latest(function (r) {
                currentDiction = r;
                renderDiction();
              }),
            )
            .catch(apiFail);
          return true;
        }
        if (mode === "conflict") {
          const ds = Array.from(conflictDomains);
          if (!ds.length) {
            showMsg(ui[currentLang].noDir);
            return false;
          }
          apiGet("conflict", { doms: ds.join(","), avoid: currentAttack ? currentAttack[0] : "", code: access ? access.code : "" })
            .then(
              latest(function (r) {
                currentAttack = r;
                renderConflict();
              }),
            )
            .catch(apiFail);
          return true;
        }
        if (mode === "custom") {
          if (!customTopics.length) {
            showMsg(ui[currentLang].noCustom);
            return false;
          }
          const pool =
            customTopics.length > 1
              ? customTopics.filter(function (t) {
                  return t !== lastCustom;
                })
              : customTopics;
          lastCustom = pool[Math.floor(Math.random() * pool.length)];
          $("topicText").textContent = lastCustom;
          return true;
        }
        if (mode === "story") {
          generateStory();
          return true;
        }
        if (selectedCategories.size === 0) {
          showMsg(ui[currentLang].noCat);
          return false;
        }
        apiGet("topic", {
          cats: Array.from(selectedCategories).join(","),
          lang: currentLang,
          avoid: lastTopic,
        })
          .then(
            latest(function (r) {
              lastTopic = r.text;
              $("topicText").textContent = r.text;
            }),
          )
          .catch(apiFail);
        return true;

      function stageInfo() {
        if (!stages) return null;
        const el = totalTime - timeLeft;
        let acc = 0;
        for (let i = 0; i < stages.length; i++) {
          const sc = stages[i].sec;
          if (el < acc + sc) return { i: i, left: acc + sc - el, len: sc };
          acc += sc;
        }
        const l = stages.length - 1;
        return { i: l, left: 0, len: stages[l].sec };
      }

        const box = $("stageBox");

            stages[si.i][currentLang].n +
            " · " +
            fmt(si.left)
          : "";
      }
      function ping() {
        const ac = audio();
        if (!ac) return;
        const t = ac.currentTime,
          o = ac.createOscillator(),
          g = ac.createGain();
        o.type = "sine";
        o.frequency.value = 392;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.3, t + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
        o.connect(g);
        g.connect(ac.destination);
        o.start(t);
        o.stop(t + 1.3);
      }
      function buzz() {
        if (mode === "debate") {
          ping();
          try {
            if (navigator.vibrate) navigator.vibrate(120);
          } catch (e) {}
        }
      }
      let AC = null;
      function audio() {
        try {
          if (!AC) {
            const C = window.AudioContext || window.webkitAudioContext;
            if (C) AC = new C();
          }
          if (AC && AC.state === "suspended") AC.resume();
        } catch (e) {}
        return AC;
      }
      function chime() {
        const ac = audio();
        if (!ac) return;
        [0, 1.6].forEach(function (off, n) {
          const t = ac.currentTime + off;
          [
            [196, 0.42, 4.5],

            let t = line.replace(/^\uFEFF/, "").trim();

      function loadPaintingImage(painting, img, spinner) {
        const thumbWidths = [700, 1000, 450];
        let widthAttempt = 0;

        function onLoaded() {
          spinner.classList.remove("show");
          img.classList.add("loaded");
        }

        function giveUp() {
          spinner.classList.remove("show");
          img.classList.remove("loaded");
          showMsg(
            currentLang === "ru"
              ? "Не удалось загрузить картину — проверьте интернет-соединение"
              : "Could not load the painting — check your internet connection",
          );
        }

        function loadFile(filename, width, onFail) {
          img.onload = onLoaded;
          img.onerror = onFail;
          img.referrerPolicy = "no-referrer";
          img.src =
            "https://commons.wikimedia.org/wiki/Special:FilePath/" +
            encodeURIComponent(filename) +
            "?width=" +
            width;
        }

        function tryKnownFilename() {
          loadFile(painting.file, thumbWidths[widthAttempt], function () {
            widthAttempt++;
            if (widthAttempt < thumbWidths.length) tryKnownFilename();
            else searchCommonsForFile();
          });
        }

        function searchCommonsForFile() {
          const query = painting.artist[1] + " " + painting.title[1];
          const searchUrl =
            "https://commons.wikimedia.org/w/api.php?action=query&list=search" +
            "&srnamespace=6&srlimit=1&format=json&origin=*&srsearch=" +
            encodeURIComponent(query);
          fetch(searchUrl)
            .then(function (res) {
              return res.json();
            })
            .then(function (data) {
              const hit = data && data.query && data.query.search && data.query.search[0];
              if (!hit) {
                giveUp();
                return;
              }
              const foundFilename = hit.title.replace(/^File:/, "");
              loadFile(foundFilename, 800, giveUp);
            })
            .catch(giveUp);
        }

        if (painting.img) {
          img.onload = onLoaded;
          img.onerror = tryKnownFilename;
          img.src = "paintings/" + painting.img + ".jpg";
        } else {
          tryKnownFilename();
        }
      }
      function storyKey(x) {
        if (!x) return "";

      const WORKOUT_TYPES = ["impromptu", "deep", "retell", "vocab", "descword", "makestory"];
      function workoutGen(type, lang) {
        const i = lang === "ru" ? 0 : 1,
          u = ui[lang];
        if (type === "impromptu" || type === "deep") {
          const k = catKeys[Math.floor(Math.random() * catKeys.length)];
          return apiGet("topic", { cats: k, lang: lang }).then(function (r) {
            return {
              label: type === "impromptu" ? u.mImp : u.mDeep,
              text: r.text,
              hint: u.wImpromptu,
              hasTimer: true,
              seconds: type === "impromptu" ? 60 : 150,
            };
          });
        }
        return apiGet("story", {
          sub: type,
          lang: lang,
          n: 6,
          diff: "easy",
        }).then(function (r) {
          if (type === "retell") {
            return {
              label: u.subRetell,
              text: r.text,
              extra: "— " + r.author + ", " + r.source,
              hint: u.st_retellPrompt,
              hasTimer: false,
            };
          }
          if (type === "vocab") {
            return {
              label: u.subVocab,
              text: r[i * 2],
              extra: r[i * 2 + 1],
              hint: u.st_vocabPrompt,
              hasTimer: false,
            };
          }
          if (type === "descword") {
            return { label: u.subDescword, text: r[i], hint: u.st_descPrompt, hasTimer: false };
          }
          if (type === "makestory") {
            return {
              label: u.subMakestory,
              text: r
                .map(function (w) {
                  return w[i];
                })
                .join(" — "),
              hint: u.st_makePrompt,
              hasTimer: false,
            };
          }
          return {
            label: u.subPainting,
            imgFile: r.file,
            imgLocal: r.img,
            extra: r.artist[i] + " — «" + r.title[i] + "», " + r.year + ". " + r.context[i],
            hint: u.st_paintPrompt,
            hasTimer: false,
          };
        });
      }
      function wcardTimer(container, seconds) {
        let left = seconds,
          running = false,
          iv = null;
        const timeEl = container.querySelector(".wcard-time"),
          btn = container.querySelector(".wcard-timerbtn");
        timeEl.textContent = fmt(left);
        btn.textContent = ui[currentLang].start;
        btn.addEventListener("click", function () {
          if (running) {
            clearInterval(iv);
            running = false;
            btn.classList.remove("on");
            btn.textContent = ui[currentLang].start;
            return;
          }
          if (left <= 0) left = seconds;
          running = true;
          audio();
          btn.classList.add("on");
          btn.textContent = ui[currentLang].pause;
          iv = setInterval(function () {
            left--;
            timeEl.textContent = fmt(Math.max(left, 0));
            if (left <= 0) {
              clearInterval(iv);
              running = false;
              btn.classList.remove("on");
              btn.textContent = ui[currentLang].start;
              chime();
              try {
                if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
              } catch (e) {}
            }
          }, 1000);
        });
      }
      function buildWorkout() {
        const rest = WORKOUT_TYPES.slice();
        const picked = ["painting"];
        for (let n = 0; n < 5 && rest.length; n++) {
          const idx = Math.floor(Math.random() * rest.length);
          picked.push(rest[idx]);
          rest.splice(idx, 1);
        }
        for (let n = picked.length - 1; n > 0; n--) {
          const j = Math.floor(Math.random() * (n + 1));
          const tmp = picked[n];
          picked[n] = picked[j];
          picked[j] = tmp;
        }
        const panel = $("workoutPanel");
        Promise.all(
          picked.map(function (type) {
            return workoutGen(type, currentLang);
          }),
        )
          .then(
            latest(function (gens) {
              panel.innerHTML = "";
              gens.forEach(function (g) {
          const card = document.createElement("div");
          card.className = "wcard";
          card.innerHTML =
            '<div class="wcard-label">' +
            g.label +
            "</div>" +
            (g.imgFile
              ? '<img class="wcard-img" loading="lazy" referrerpolicy="no-referrer" src="' +
                (g.imgLocal
                  ? "paintings/" + g.imgLocal + ".jpg"
                  : "https://commons.wikimedia.org/wiki/Special:FilePath/" +
                    encodeURIComponent(g.imgFile) +
                    "?width=500") +
                '" data-fb="https://commons.wikimedia.org/wiki/Special:FilePath/' +
                encodeURIComponent(g.imgFile) +
                '?width=500" alt="" onerror="if(!this.dataset.r){this.dataset.r=1;this.src=this.dataset.fb}else{this.style.display=\'none\'}">'
              : "") +
            (g.text ? '<div class="wcard-text">' + g.text + "</div>" : "") +
            (g.extra ? '<div class="wcard-extra">' + g.extra + "</div>" : "") +
            (g.hint ? '<div class="wcard-hint">' + g.hint + "</div>" : "") +
            (g.hasTimer
              ? '<div class="wcard-timer"><span class="wcard-time"></span><button class="wcard-timerbtn"></button></div>'
              : "");
          panel.appendChild(card);
          if (g.hasTimer) wcardTimer(card, g.seconds);
              });
              document.body.classList.add("training-active");
              if (window.innerWidth <= 500)
                setTimeout(function () {
                  panel.scrollIntoView({ behavior: "smooth", block: "start" });
                }, 100);
            }),
          )
          .catch(apiFail);
      }

        }).observe($("startBtn"), { childList: true });
        const PRESS_SEL =
          ".ctrl-btn-small,.action-btn,.sw-btn,.tbar-btn,.category-pill,.mode-btn,.preset-btn,.dpreset-btn,.dir-btn,.workout-btn";
        function pressFlash(e) {
          const b = e.target.closest && e.target.closest(PRESS_SEL);
          if (b) {
            b.classList.add("pressed");
            setTimeout(function () {
              b.classList.remove("pressed");
            }, 260);
          }
        }
        document.addEventListener("pointerdown", function (e) {
          if (e.pointerType === "mouse") pressFlash(e);
        });
        document.addEventListener("click", function (e) {
          if (e.pointerType !== "mouse" && e.detail !== 0) pressFlash(e);
        });
        document.querySelectorAll("#conflictPanel .dir-btn").forEach(function (b) {
          b.addEventListener("click", function () {
            const d = b.dataset.cdom;
            if (conflictDomains.has(d)) {
              if (conflictDomains.size > 1) {
                conflictDomains.delete(d);
                b.classList.remove("active");
              }
            } else {
              conflictDomains.add(d);
              b.classList.add("active");
            }
          });
        });
        $("tipBtn").addEventListener("click", function () {
          const show = $("conflictTip").classList.toggle("show");
          $("tipBtn").textContent = show ? ui[currentLang].tipHide : ui[currentLang].tipShow;
        });
        $("wordMeaningsBtn").addEventListener("click", function () {
          const show = $("wordMeanings").classList.toggle("show");
          $("wordMeaningsBtn").textContent = show
            ? ui[currentLang].hideMeanings
            : ui[currentLang].seeMeanings;
        });
        $("workoutBtn").addEventListener("click", buildWorkout);
        $("workoutCloseBtn").addEventListener("click", function () {
          document.body.classList.remove("training-active");
        });
        document.querySelectorAll(".mode-btn").forEach(function (b) {
          b.addEventListener("click", function () {
            if (PREMIUM_MODES.indexOf(b.dataset.mode) >= 0 && !hasAccess()) {
              openMore(true);
              return;
            }
            setMode(b.dataset.mode);
          });
        });
        $("flipSideBtn").addEventListener("click", function () {
          debateSide = debateSide === "pro" ? "con" : "pro";
          renderSide();
        });
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible" && timerRunning) {
            tick();
            if (timerRunning) lockScreen();
          }
        });
      }
      init();
    </script>
  </body>
</html>
